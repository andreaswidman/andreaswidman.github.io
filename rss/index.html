<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RSS">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <link id="apple-touch-icon" rel="apple-touch-icon">
  <link id="favicon" rel="icon" type="image/jpeg">
  <title>RSS</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #stage {
      display: flex;
      width: 200vw;
      height: 100vh;
      will-change: transform;
      transition: transform 420ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #stage.is-switching {
      pointer-events: none;
    }

    #feed,
    #feed-tcba {
      height: 100vh;
      width: 100vw;
      flex-shrink: 0;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      overflow-anchor: none;
    }

    #feed::-webkit-scrollbar,
    #feed-tcba::-webkit-scrollbar {
      display: none;
    }

    .post {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10vh 0;
      background: #fff;
      position: relative;
    }

    .post a {
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .post img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
    }

    .source-label {
      margin-top: 8px;
      text-align: center;
      font: 12px/1.4 system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #000;
      opacity: 0;
      transition: opacity 200ms ease;
      pointer-events: none;
    }

    .reblog-btn {
      margin-left: 10px;
      cursor: pointer;
      text-decoration: underline;
      color: #555;
      pointer-events: auto;
    }

    .post.is-holding .source-label {
      opacity: 1;
    }

    .spinner,
    #ptr .ptr-spinner {
      border: 2px solid #ddd;
      border-top-color: #999;
      border-radius: 50%;
    }

    .spinner {
      position: absolute;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-slide {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #auth {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 10;
    }

    #auth-inner {
      display: flex;
      gap: 8px;
    }

    #auth input {
      font: 16px/1.4 system-ui, sans-serif;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #auth button {
      font: 16px/1.4 system-ui, sans-serif;
      padding: 10px 24px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #new-posts-pill {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font: 12px/1.4 system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      z-index: 100;
      cursor: pointer;
      display: none;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
    }

    #mode-indicator {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      padding: 5px 14px;
      border-radius: 20px;
      font: 11px/1.4 system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      z-index: 100;
      opacity: 0;
      transition: opacity 300ms ease;
      pointer-events: none;
      white-space: nowrap;
    }

    #mode-indicator.visible {
      opacity: 1;
    }

    #ptr {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }

    #ptr .ptr-spinner {
      width: 22px;
      height: 22px;
      opacity: 0;
      transition: opacity 150ms ease;
    }

    #ptr.ptr-loading .ptr-spinner {
      opacity: 1;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>
  <div id="auth">
    <form id="auth-inner">
      <input id="passphrase" type="password" autocomplete="current-password" aria-label="Passphrase" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <div id="new-posts-pill">↑ New posts</div>
  <div id="mode-indicator"></div>
  <div id="ptr"><div class="ptr-spinner"></div></div>
  <div id="stage">
    <main id="feed"></main>
    <main id="feed-tcba"></main>
  </div>
  <script>
    history.scrollRestoration = 'manual';

    const CONFIG = {
      proxy: '/api/proxy?url=',
      preloadAhead: 3
    };

    const feedCache = new Map(); // url → { text, ts }
    const INACTIVE_THRESHOLD = 5 * 60_000; // 5 minutes
    let hiddenAt = null;
    let pendingNewItems = [];

    // ── Feeds (0 = main, 1 = tcba) ───────────────────────────────────────────
    let mainFeed, tcbaFeed;
    let currentMode = 0;
    const currentFeed = () => (currentMode === 0 ? mainFeed : tcbaFeed);

    function createFeed(id, sources) {
      return {
        el: document.getElementById(id),
        sources,                // every feed base URL
        active: [...sources],   // bases that still have older pages
        items: [],
        seen: new Set(),
        index: 0,
        page: 1,
        exhausted: false,
        loadPromise: null,
        scrolling: false,
        scrollingTimer: null,
        preloadedUpTo: -1,
        slide: null
      };
    }

    // ── Shared helpers ───────────────────────────────────────────────────────

    async function fetchFeed(feedUrl) {
      const cached = feedCache.get(feedUrl);
      if (cached && Date.now() - cached.ts < INACTIVE_THRESHOLD) return cached.text;
      const text = await fetch(CONFIG.proxy + encodeURIComponent(feedUrl)).then(r => r.text());
      feedCache.set(feedUrl, { text, ts: Date.now() });
      return text;
    }

    function pickBestSrc(img) {
      const srcset = img.getAttribute('srcset');
      if (!srcset) return img.getAttribute('src');
      const best = srcset.split(',')
        .map(s => {
          const [url, w] = s.trim().split(/\s+/);
          return { url, w: parseInt(w) || 0 };
        })
        .sort((a, b) => b.w - a.w);
      return best[0]?.url || img.getAttribute('src');
    }

    function extractItems(item, feedUrl, site) {
      const desc = item.querySelector('description');
      if (!desc) return [];
      const doc = new DOMParser().parseFromString(desc.textContent, 'text/html');
      const urls = Array.from(doc.querySelectorAll('img')).map(img => pickBestSrc(img)).filter(Boolean);
      const pubDate = item.querySelector('pubDate')?.textContent;
      const date = pubDate ? new Date(pubDate) : new Date(0);
      const link = item.querySelector('link')?.textContent?.trim() || feedUrl;
      return urls.map(url => ({ url, date, link, site }));
    }

    function parseItems(xml, base) {
      const site = (() => { try { return new URL(base).hostname.replace(/^www\./, ''); } catch { return base; } })();
      const doc = new DOMParser().parseFromString(xml, 'text/xml');
      return Array.from(doc.querySelectorAll('item')).flatMap(item => extractItems(item, base, site));
    }

    const byNewest = (a, b) => b.date - a.date;
    const unseen = (feed, items) => items.filter(i => !feed.seen.has(i.url));

    function createPostEl(item, idx) {
      const article = document.createElement('article');
      article.className = 'post';
      article.dataset.index = idx;

      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      article.appendChild(spinner);

      const anchor = document.createElement('a');
      anchor.href = item.link;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';

      const img = document.createElement('img');
      img.src = item.url;
      img.alt = '';
      img.loading = idx < 2 ? 'eager' : 'lazy';
      img.onload = () => spinner.remove();
      anchor.appendChild(img);
      article.appendChild(anchor);

      const label = document.createElement('span');
      label.className = 'source-label';
      label.textContent = item.site;

      if (item.url.includes('tumblr.com') && /\/post\/\d+|tumblr\.com\/[^/]+\/\d+/.test(item.link)) {
        const reblogBtn = document.createElement('span');
        reblogBtn.className = 'reblog-btn';
        reblogBtn.textContent = 'reblog';
        reblogBtn.addEventListener('click', async e => {
          e.stopPropagation();
          reblogBtn.textContent = 'reblogging…';
          try {
            const res = await fetch('/api/reblog?postUrl=' + encodeURIComponent(item.link), {
              method: 'POST'
            });
            const json = await res.json();
            reblogBtn.textContent = res.ok ? '✓ reblogged' : '✗ ' + (json.error || 'error');
          } catch {
            reblogBtn.textContent = '✗ error';
          }
        });
        label.appendChild(reblogBtn);
      }

      article.appendChild(label);

      anchor.addEventListener('click', e => {
        e.preventDefault();
        article.classList.toggle('is-holding');
      });

      anchor.addEventListener('dblclick', e => {
        e.preventDefault();
        window.open(anchor.href, '_blank', 'noopener');
      });

      // Double-tap on whitespace (the article background, not the image) → switch mode
      let lastTapTime = 0;
      article.addEventListener('click', e => {
        if (e.target !== article) return;
        const now = Date.now();
        if (now - lastTapTime < 300) switchMode(currentMode === 0 ? 1 : 0);
        lastTapTime = now;
      });

      return article;
    }

    // ── Mode switch ──────────────────────────────────────────────────────────

    let modeIndicatorTimer;
    function showModeIndicator(label) {
      const el = document.getElementById('mode-indicator');
      el.textContent = label;
      el.classList.add('visible');
      clearTimeout(modeIndicatorTimer);
      modeIndicatorTimer = setTimeout(() => el.classList.remove('visible'), 1400);
    }

    function switchMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;
      const stage = document.getElementById('stage');
      stage.classList.add('is-switching');
      stage.style.transform = `translateX(${-mode * 100}vw)`;
      stage.addEventListener('transitionend', () => stage.classList.remove('is-switching'), { once: true });
      showModeIndicator(mode === 0 ? 'Main feed' : 'thiscouldbeawesome');

      if (mode === 1 && !tcbaFeed.slide) mountFeed(tcbaFeed);
    }

    // ── Swipe to switch mode ─────────────────────────────────────────────────

    function addSwipeListener(el) {
      let sx, sy;
      el.addEventListener('touchstart', e => {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });
      el.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          switchMode(dx < 0 ? 1 : 0);
        }
      }, { passive: true });
    }

    // ── Pull to refresh ──────────────────────────────────────────────────────

    function addPullToRefresh(feedEl, refreshFn) {
      const ptr = document.getElementById('ptr');
      const ptrSpinner = ptr.querySelector('.ptr-spinner');
      const THRESHOLD = 80;
      let startY = 0;
      let pulling = false;
      let refreshing = false;

      feedEl.addEventListener('touchstart', e => {
        if (refreshing || feedEl.scrollTop > 0) return;
        startY = e.touches[0].clientY;
        pulling = true;
      }, { passive: true });

      feedEl.addEventListener('touchmove', e => {
        if (!pulling || refreshing) return;
        if (feedEl.scrollTop > 0) { pulling = false; return; }
        const dy = e.touches[0].clientY - startY;
        if (dy <= 0) { pulling = false; return; }
        e.preventDefault();
        feedEl.style.transform = `translateY(${Math.min(dy * 0.4, THRESHOLD)}px)`;
        ptrSpinner.style.opacity = Math.min(dy / THRESHOLD, 1);
      }, { passive: false });

      feedEl.addEventListener('touchend', e => {
        if (!pulling) return;
        const dy = e.changedTouches[0].clientY - startY;
        pulling = false;
        ptrSpinner.style.opacity = '';

        const snapBack = () => {
          feedEl.style.transition = 'transform 280ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
          feedEl.style.transform = '';
          feedEl.addEventListener('transitionend', () => { feedEl.style.transition = ''; }, { once: true });
        };

        if (dy >= THRESHOLD && !refreshing) {
          refreshing = true;
          ptr.classList.add('ptr-loading');
          snapBack();
          refreshFn().finally(() => {
            refreshing = false;
            ptr.classList.remove('ptr-loading');
          });
        } else {
          snapBack();
        }
      }, { passive: true });
    }

    // ── Feed behaviour (shared by main + tcba) ───────────────────────────────

    function addLoadingSlide(feed) {
      const slide = document.createElement('article');
      slide.className = 'loading-slide';
      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      slide.appendChild(spinner);
      feed.el.appendChild(slide);
      feed.slide = slide;
    }

    function renderPosts(feed, items, startIndex) {
      const before = feed.slide?.parentNode ? feed.slide : null;
      items.forEach((item, i) => feed.el.insertBefore(createPostEl(item, startIndex + i), before));
    }

    function prependItems(feed, items) {
      items.forEach(i => feed.seen.add(i.url));
      feed.items.unshift(...items);
      feed.preloadedUpTo = -1;
      const fragment = document.createDocumentFragment();
      items.forEach((item, i) => fragment.appendChild(createPostEl(item, i)));
      feed.el.insertBefore(fragment, feed.el.querySelector('.post'));
      feed.el.scrollTop = 0;
      feed.index = 0;
      preloadAround(feed, 0);
    }

    function navigateTo(feed, index) {
      feed.index = Math.max(0, Math.min(index, feed.items.length - 1));
      feed.scrolling = true;
      feed.el.scrollTo({ top: feed.index * window.innerHeight, behavior: 'smooth' });
      preloadAround(feed, feed.index);
      clearTimeout(feed.scrollingTimer);
      feed.scrollingTimer = setTimeout(() => { feed.scrolling = false; }, 800);
    }

    function observeScroll(feed) {
      let scrollTimer;
      feed.el.addEventListener('scroll', () => {
        if (feed.scrolling) return;
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          feed.index = Math.round(feed.el.scrollTop / window.innerHeight);
          preloadAround(feed, feed.index);
          if (feed.index >= feed.items.length - 5) loadNextPage(feed);
        }, 100);
      });
      feed.el.addEventListener('scrollend', () => { feed.scrolling = false; });
    }

    function observeLoadingSlide(feed) {
      const observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && feed.index >= feed.items.length - 1) loadNextPage(feed);
      }, { root: feed.el, threshold: 0.1 });
      observer.observe(feed.slide);
    }

    function preloadAround(feed, index) {
      const end = Math.min(feed.items.length, index + CONFIG.preloadAhead + 1);
      for (let i = Math.max(index, feed.preloadedUpTo + 1); i < end; i++) {
        new Image().src = feed.items[i].url;
      }
      feed.preloadedUpTo = Math.max(feed.preloadedUpTo, end - 1);
    }

    function loadNextPage(feed) {
      if (feed.exhausted) return;
      feed.loadPromise ??= fetchPage(feed).finally(() => { feed.loadPromise = null; });
      return feed.loadPromise;
    }

    async function fetchPage(feed) {
      const startIndex = feed.items.length;
      const bases = feed.active;
      const results = await Promise.allSettled(bases.map(base => {
        const feedUrl = feed.page === 1 ? base + '/rss' : base + '/page/' + feed.page + '/rss';
        return fetchFeed(feedUrl).then(xml => parseItems(xml, base));
      }));
      feed.page++;

      const newItems = [];
      const emptyBases = new Set();
      let fetchError = false;
      results.forEach((result, i) => {
        if (result.status === 'rejected') {
          console.warn('Feed error:', result.reason);
          fetchError = true;
        } else if (result.value.length === 0) {
          emptyBases.add(bases[i]); // no older pages left for this source
        } else {
          newItems.push(...result.value);
        }
      });
      feed.active = bases.filter(base => !emptyBases.has(base));

      const fresh = unseen(feed, newItems).sort(byNewest);
      if (fresh.length > 0) {
        fresh.forEach(i => feed.seen.add(i.url));
        feed.items.push(...fresh);
        renderPosts(feed, fresh, startIndex);
        preloadAround(feed, startIndex);
      }

      if (!fetchError && (fresh.length === 0 || feed.active.length === 0)) {
        feed.exhausted = true;
        feed.slide?.remove();
      }
      return fresh.length > 0 ? startIndex : undefined;
    }

    async function fetchLatest(feed) {
      const since = feed.items[0]?.date ?? new Date(0);
      const results = await Promise.allSettled(feed.sources.map(async base => {
        const feedUrl = base + '/rss';
        const text = await fetch(CONFIG.proxy + encodeURIComponent(feedUrl), { cache: 'no-cache' }).then(r => r.text());
        feedCache.set(feedUrl, { text, ts: Date.now() });
        return parseItems(text, base);
      }));
      results.forEach(r => { if (r.status === 'rejected') console.warn('Refresh error:', r.reason); });
      const found = results.flatMap(r => (r.status === 'fulfilled' ? r.value : []));
      return unseen(feed, found.filter(item => item.date > since)).sort(byNewest);
    }

    async function pullRefresh(feed) {
      const fresh = await fetchLatest(feed);
      if (fresh.length === 0) return;
      prependItems(feed, fresh);
      if (feed === mainFeed) {
        document.getElementById('new-posts-pill').style.display = 'none';
        pendingNewItems = [];
      }
    }

    function mountFeed(feed) {
      addLoadingSlide(feed);
      const firstPage = loadNextPage(feed);
      observeScroll(feed);
      observeLoadingSlide(feed);
      addPullToRefresh(feed.el, () => pullRefresh(feed));
      return firstPage;
    }

    // ── Keyboard navigation ──────────────────────────────────────────────────

    document.addEventListener('keydown', async e => {
      const feed = currentFeed();
      if (!feed) return;
      const key = e.key.toLowerCase();
      if (key === 'k') {
        navigateTo(feed, feed.index - 1);
      } else if (key === 'j') {
        if (feed.index >= feed.items.length - 1) {
          if (!feed.slide?.isConnected) return;
          feed.slide.scrollIntoView({ behavior: 'smooth' });
          const startIdx = await loadNextPage(feed);
          if (startIdx != null) navigateTo(feed, startIdx);
        } else {
          if (feed.index >= feed.items.length - 5) loadNextPage(feed);
          navigateTo(feed, feed.index + 1);
        }
      }
    });

    const authEl = document.getElementById('auth');

    async function startApp() {
      authEl.remove();
      const feeds = await fetch('/feeds.json').then(r => r.json());
      mainFeed = createFeed('feed', feeds.main);
      tcbaFeed = createFeed('feed-tcba', [feeds.tcba]);
      addSwipeListener(mainFeed.el);
      addSwipeListener(tcbaFeed.el);
      await mountFeed(mainFeed);

      if (mainFeed.items.length > 0) {
        const iconUrl = mainFeed.items[0].url;
        document.getElementById('apple-touch-icon').href = iconUrl;
        document.getElementById('favicon').href = iconUrl;
      }

      mainFeed.el.scrollTop = 0;
    }

    async function checkForNewPosts() {
      pendingNewItems = await fetchLatest(mainFeed);
      if (pendingNewItems.length > 0) {
        document.getElementById('new-posts-pill').style.display = 'block';
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        hiddenAt = Date.now();
      } else if (hiddenAt !== null && Date.now() - hiddenAt >= INACTIVE_THRESHOLD && mainFeed?.items.length > 0) {
        checkForNewPosts();
        hiddenAt = null;
      } else {
        hiddenAt = null;
      }
    });

    document.getElementById('new-posts-pill').addEventListener('click', () => {
      document.getElementById('new-posts-pill').style.display = 'none';
      const items = pendingNewItems;
      pendingNewItems = [];
      if (items.length > 0) prependItems(mainFeed, items);
    });

    document.getElementById('auth-inner').addEventListener('submit', async e => {
      e.preventDefault();
      const button = e.target.querySelector('button');
      button.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passphrase: document.getElementById('passphrase').value })
        });
        if (res.ok) return startApp();
        button.textContent = res.status === 401 ? 'Wrong passphrase' : 'Error';
      } catch {
        button.textContent = 'Error';
      }
      button.disabled = false;
    });

    fetch('/api/login').then(res => { if (res.ok) startApp(); });
  </script>
</body>
</html>
